<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'">
<title>Share your screen</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #0f1412; color: #fff; font: 15px "Segoe UI", system-ui, sans-serif; }
  header { padding: 18px 22px 6px; }
  h1 { margin: 0; font-size: 20px; font-weight: 700; }
  header p { margin: 4px 0 0; color: #9aa39e; }
  main { flex: 1; overflow-y: auto; padding: 8px 22px 16px; }
  h2 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #9aa39e; margin: 14px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  button.src { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: 12px; background: #1a211e; outline: 2px solid transparent; }
  button.src:hover { background: #222b27; }
  button.src:focus-visible { outline-color: #3ddc84; }
  button.src.on { outline-color: #3ddc84; background: #1d2b24; }
  button.src img { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; border-radius: 8px; }
  button.src span { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  footer { display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-top: 1px solid #222b27; }
  label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  label input { width: 18px; height: 18px; accent-color: #12805f; }
  .spacer { flex: 1; }
  .btn { border: 0; border-radius: 10px; padding: 10px 18px; font: 600 15px "Segoe UI", system-ui, sans-serif; cursor: pointer; background: #262f2a; color: #fff; }
  .btn.primary { background: #12805f; }
  .btn:disabled { opacity: .45; cursor: default; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Share your screen</h1>
  <p>Pick what everyone on the call should see.</p>
</header>
<main>
  <h2 id="screensHead">Whole screen</h2>
  <div class="grid" id="screens"></div>
  <h2 id="windowsHead">A window</h2>
  <div class="grid" id="windows"></div>
</main>
<footer>
  <label id="soundRow" class="hidden"><input type="checkbox" id="sound" checked> Share computer sound (music, videos)</label>
  <span class="spacer"></span>
  <button class="btn" id="cancel" type="button">Cancel</button>
  <button class="btn primary" id="share" type="button" disabled>Share</button>
</footer>
<script src="picker.js"></script>
</body>
</html>
