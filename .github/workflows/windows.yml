name: Build Gather for Windows

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Electron and the packager
        run: npm install --no-audit --no-fund

      - name: Set the version from the run number
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version

      # Not code-signed (that needs a paid certificate), so Windows shows a
      # SmartScreen warning the first time: More info, then Run anyway.
      - name: Build the installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never

      - name: Publish as the win-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-latest
          name: Gather for Windows
          body: |
            Gather as a Windows app: its own window onto https://gathercall.uk, with a screen picker that can share the computer's sound too (music and videos for quiz night), and a menu item for Quiz night (host).

            Download and run: https://github.com/immmahh-sketch/gather/releases/download/win-latest/Gather-Setup.exe

            It installs for the current user (no admin needed) and adds Start menu and desktop shortcuts. It isn't code-signed, so the first time Windows says it protected your PC: click More info, then Run anyway.
          files: windows/dist/Gather-Setup.exe
