<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gather TV</title>
<meta name="theme-color" content="#0f1412">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/config.js"></script>
<script src="assets/gate.js"></script>
<style>
  body.tv-home { background: radial-gradient(1200px 700px at 50% -10%, rgba(18, 128, 95, .35), transparent 70%), #0f1412; color: #f2f4f3; min-height: 100vh; display: grid; place-items: center; padding: 40px; }
  .tv-card { width: 100%; max-width: 720px; text-align: center; }
  .tv-card .brand { justify-content: center; font-size: 34px; margin-bottom: 26px; }
  .tv-card .brand .mark { width: 56px; height: 56px; border-radius: 14px; }
  .tv-card h1 { font-size: 40px; margin: 0 0 8px; letter-spacing: -0.02em; }
  .tv-card p { color: #9aa39e; font-size: 20px; margin: 0 0 28px; }
  .tv-card input { width: 100%; padding: 20px 22px; font-size: 26px; border-radius: 16px; border: 2px solid #2a332e; background: #161c19; color: #fff; text-align: center; margin-bottom: 18px; }
  .tv-card input::placeholder { color: #7c8580; }
  .tv-card input:focus { outline: none; border-color: #3ddc84; box-shadow: 0 0 0 4px rgba(61, 220, 132, .25); }
  .tv-card button { width: 100%; padding: 20px; font-size: 26px; font-weight: 700; border-radius: 16px; border: 2px solid transparent; background: #12805f; color: #fff; }
  .tv-card button:focus { outline: none; border-color: #3ddc84; box-shadow: 0 0 0 4px rgba(61, 220, 132, .25); }
  .tv-card .recent { margin-top: 26px; color: #9aa39e; font-size: 18px; }
  .tv-card .recent button { width: auto; display: inline-block; margin: 8px 6px 0; padding: 12px 18px; font-size: 20px; background: #1e2622; }
  .tv-card .foot { margin-top: 30px; color: #6f7874; font-size: 16px; }
</style>
</head>
<body class="tv-home">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="markg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e9e70"/><stop offset="1" stop-color="#0a6448"/></linearGradient>
    <symbol id="mark" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="url(#markg)"/>
      <g fill="#fff" stroke="url(#markg)" stroke-width="6.4" paint-order="stroke">
        <circle cx="32" cy="25" r="11"/><circle cx="22" cy="42" r="11"/><circle cx="42" cy="42" r="11"/>
      </g>
    </symbol>
  </defs>
</svg>
<form class="tv-card" id="form">
  <div class="brand"><svg class="mark"><use href="#mark"/></svg><span>Gather TV</span></div>
  <h1>Watch a room</h1>
  <p>Type the room name from the invite link, then press Watch. Shared screens fill the TV.</p>
  <input id="room" type="text" placeholder="Room name" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off">
  <button type="submit" id="watch">Watch</button>
  <div class="recent hidden" id="recent"></div>
  <div class="foot">Press Back on the remote to leave a room.</div>
</form>
<script>
(() => {
  const slug = s => String(s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  const title = s => s.split('-').filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join(' ');
  const input = document.getElementById('room');
  let recent = [];
  try { recent = JSON.parse(localStorage.getItem('gather.tvrooms') || '[]'); } catch {}
  if (recent.length) {
    const box = document.getElementById('recent');
    box.classList.remove('hidden');
    box.append('Recent: ');
    for (const r of recent) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = title(r);
      b.addEventListener('click', () => go(r));
      box.appendChild(b);
    }
    input.value = recent[0];
  }
  function go(room) {
    room = slug(room);
    if (!room) return;
    recent = [room].concat(recent.filter(r => r !== room)).slice(0, 4);
    try { localStorage.setItem('gather.tvrooms', JSON.stringify(recent)); } catch {}
    location.href = 'call.html?room=' + encodeURIComponent(room) + '&tv=1';
  }
  document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); let v = input.value.trim(); try { const u = new URL(v.match(/^https?:\/\//) ? v : 'https://' + v); v = u.searchParams.get('room') || v; } catch {} go(v); });
  (window.GATHER_READY || Promise.resolve()).then(() => setTimeout(() => (recent.length ? document.getElementById('watch') : input).focus(), 100));
})();
</script>
</body>
</html>
